# Matrice d'acces de la Sorabel Data Gateway
#
# SOURCE DE VERITE UNIQUE des droits (decision D21), pour le CODE. Elle transcrit
# la matrice imposee par docs/cadrage_dsi.md, qui fait foi et que la suite
# d'acceptance boite noire controle (tests/conftest.py, TOOLS_BY_PROFILE).
#
# En cas de divergence : cadrage_dsi.md gagne sur ce fichier, et ce fichier gagne
# sur tous les tableaux des chantiers de conception, qui en sont des VUES.
#
# Ce que ce fichier N'EST PAS :
#   - il ne dit pas QUI appelle. L'identite vient du lancement, variable
#     SORABEL_PROFILE, jamais d'un parametre de tool.
#
# Politique : DENY BY DEFAULT sur les quatre axes. Un tool, une collection, une
# table ou une colonne qui n'est pas explicitement classee ici fait ECHOUER le
# controle. Une colonne ajoutee a la base ne devient pas visible par defaut.
#
# Verifier : python governance/verifier_matrice.py

version: 3

# --- Le catalogue, ferme. Huit tools, nommes par le cadrage DSI. -------------
catalogue:
  rag:
    - answer_question   # RAG complet, reponse ancree + sources (E1)
    - search_docs       # brique : passages classes, aucune generation
    - get_document      # brique : un document complet
    - list_sources      # brique : inventaire du corpus
  sql:
    - ask_database      # Text-to-SQL generatif, pile de gardes
    - get_schema        # schema commente, aucune donnee renvoyee
    - check_stock       # fige, une reference
    - order_status      # fige, une commande

# --- Collections documentaires -----------------------------------------------
# Le NOM vient du cadrage DSI, c'est le vocabulaire de gouvernance. Le doc_type
# est la metadonnee portee par chaque chunk, et c'est sur elle que le filtre
# s'applique. Le dossier n'est que l'origine des fichiers.
collections:
  fiches_techniques:
    doc_type: fiche_technique
    dossier: fiches
  notices:
    doc_type: notice
    dossier: notices
  procedures_sav:
    doc_type: procedure_sav
    dossier: sav
  notes_internes:
    doc_type: note_interne
    dossier: notes

# --- Classification des colonnes, EXHAUSTIVE ---------------------------------
# Les trois listes doivent couvrir exactement les colonnes de la base.

# E5, litteral du brief : "les colonnes sensibles (prix d'achat, marges) ne
# sortent jamais pour le profil support".
colonnes_sensibles:
  - produits.prix_achat_ht
  - produits.marge_pct
  - ventes.marge_ht

# Au-dela du litteral d'E5. Donnee a caractere personnel, sur un profil dont le
# client est un bot Slack tourne vers l'exterieur. Le cadrage DSI ne la nomme
# pas ; la classifier etait obligatoire, la classification etant exhaustive.
# DECISION A CONFIRMER PAR LE PILOTE, reversible en retirant deux lignes.
colonnes_restreintes:
  - clients.email

# Tout le reste. Une colonne listee ici peut sortir pour n'importe quel profil
# qui a la table correspondante.
colonnes_publiques:
  - clients.id
  - clients.raison_sociale
  - clients.segment
  - clients.ville
  - commandes.id
  - commandes.client_id
  - commandes.date_commande
  - commandes.statut
  - commandes.montant_ht
  - produits.ref
  - produits.nom
  - produits.categorie
  - produits.fabricant
  - produits.unite
  - produits.prix_vente_ht
  - produits.actif
  - stocks.id
  - stocks.ref
  - stocks.entrepot
  - stocks.quantite
  - stocks.seuil_reappro
  - ventes.id
  - ventes.commande_id
  - ventes.ref
  - ventes.quantite
  - ventes.prix_unitaire_ht
  - ventes.remise_pct

# --- Lexique de refus explicite ----------------------------------------------
# Termes qui DESIGNENT une ressource retiree, en langage naturel. Ils servent au
# pre-filtre de la couche 0 bis : une question qui nomme une colonne ou une table
# retiree recoit un refus explicite, au lieu d'un hors-schema du modele qui ne
# voit pas la colonne.
#
# CE N'EST PAS UNE GARANTIE DE SECURITE. Une liste de mots se contourne. La
# securite reste portee par les couches AST. Ce lexique rend le refus EXPLICITE
# et IMPUTABLE, donc journalisable et demontrable (E5).
lexique_refus:
  produits.prix_achat_ht: [prix d'achat, prix achat, cout d'achat, achat fournisseur]
  produits.marge_pct: [marge, marges, taux de marge, marge en pourcentage]
  ventes.marge_ht: [marge, marges, marge sur vente, marge en euros]
  clients.email: [email, e-mail, mail, adresse mail, courriel, coordonnees]

# --- Les profils. DEUX, imposes par le cadrage DSI et par conftest.py. --------
# Le profil dev de nos chantiers 1 a 3 N'EXISTE PAS au contrat. Voir la note
# D18 et P6 RENVERSES, chantier 3.

profils:

  support:
    description: bot Slack du SAV, client tourne vers l'exterieur
    tools:
      - answer_question
      - search_docs
      - get_document
      - list_sources
      - ask_database
      - check_stock
      - order_status
    collections:
      - fiches_techniques
      - notices
      - procedures_sav
    tables:
      - clients
      - produits
      - stocks
      - commandes
    colonnes_interdites:
      - produits.prix_achat_ht
      - produits.marge_pct
      - ventes.marge_ht
      - clients.email

  commercial:
    description: poste commercial
    tools:
      - answer_question
      - search_docs
      - get_document
      - list_sources
      - ask_database
      - get_schema
      - check_stock
      - order_status
    collections:
      - fiches_techniques
      - notices
      - procedures_sav
      - notes_internes
    tables:
      - clients
      - produits
      - stocks
      - commandes
      - ventes
    colonnes_interdites: []

# --- Invariants verifies par le script --------------------------------------
# Ils sont ecrits ici pour etre LUS. Ils sont controles contre des ancres
# ecrites EN DUR dans le script : un invariant qui se verifie contre une donnee
# du meme fichier ne verifie rien, il s'annule avec elle.
invariants:
  - id: catalogue_exact
    enonce: le catalogue est exactement les 8 tools nommes par le cadrage DSI
  - id: profils_exacts
    enonce: les profils sont exactement support et commercial
  - id: contrat_tools_par_profil
    enonce: les tools de chaque profil sont exactement ceux de tests/conftest.py
  - id: E5_colonnes_sensibles_ancrees
    enonce: colonnes_sensibles est exactement les 3 colonnes nommees par E5
  - id: E5_support_sans_colonnes_sensibles
    enonce: le profil support interdit les colonnes sensibles et restreintes
  - id: E5_ventes_hors_perimetre_support
    enonce: la table ventes n'est pas accessible au profil support
  - id: E5_notes_interdites_support
    enonce: la collection notes_internes n'est pas accessible au support
  - id: classification_exhaustive
    enonce: les trois listes de colonnes couvrent exactement le schema de la base
  - id: doc_type_reels
    enonce: chaque doc_type declare existe dans le corpus, et reciproquement
  - id: lexique_complet
    enonce: chaque colonne retiree a au moins un terme dans le lexique de refus
  - id: schema_reel
    enonce: toute table et toute colonne citee existe dans la base
